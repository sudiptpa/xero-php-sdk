      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>

    <!-- Xero blue glow -->
    <radialGradient id="xeroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#13B5EA" stop-opacity="0.20"/>
